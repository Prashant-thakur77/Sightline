# Render blueprint: web app, private vision service and Postgres.
# Secrets are set in the Render dashboard (sync: false); nothing secret lives here.
databases:
  - name: sightline-db
    databaseName: sightline
    user: sightline
    plan: basic-256mb

services:
  - type: web
    name: sightline-web
    runtime: node
    plan: starter
    region: oregon
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @sightline/web build && node scripts/prepare-standalone.mjs
    preDeployCommand: pnpm --filter @sightline/db migrate
    startCommand: node apps/web/.next/standalone/apps/web/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_API_BASE
        value: https://api-m.sandbox.paypal.com
      - key: DATABASE_URL
        fromDatabase:
          name: sightline-db
          property: connectionString
      - key: VISION_SERVICE_URL
        fromService:
          type: pserv
          name: sightline-vision
          envVarKey: VISION_INTERNAL_URL
      - key: APP_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: RECEIPT_SIGNING_KEY
        sync: false
      - key: HELPER_LINK_SECRET
        generateValue: true
      - key: MAINTENANCE_TOKEN
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_MERCHANT_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AGENT_MODEL
        value: claude-opus-5-5
      - key: VISION_MODEL
        value: claude-opus-5-5
      - key: FAST_MODEL
        value: claude-haiku-5-5
      - key: CHANNEL3_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: KERNEL_API_KEY
        sync: false
      - key: AG_STUDIO
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: WEB_PUSH_VAPID_PUBLIC
        sync: false
      - key: WEB_PUSH_VAPID_PRIVATE
        sync: false

  # Every 15 minutes: payment-hold deadlines (void when a store doesn't answer, pay the store a
  # week after an unchecked delivery, retry failed captures, reauthorize after the honour period),
  # photo retention and webhook retries. Same token as the web service.
  - type: cron
    name: sightline-maintenance
    runtime: node
    plan: starter
    region: oregon
    schedule: "*/15 * * * *"
    buildCommand: "true"
    startCommand: node -e "fetch(process.env.APP_URL + '/api/maintenance', { method: 'POST', headers: { authorization: 'Bearer ' + process.env.MAINTENANCE_TOKEN } }).then(async (r) => { console.log(r.status, await r.text()); process.exit(r.ok ? 0 : 1); }).catch((e) => { console.error(e); process.exit(1); })"
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: APP_URL
        sync: false
      - key: MAINTENANCE_TOKEN
        sync: false

  - type: pserv
    name: sightline-vision
    runtime: docker
    plan: standard
    region: oregon
    dockerfilePath: ./services/vision/Dockerfile
    dockerContext: ./services/vision
    envVars:
      - key: PORT
        value: "8011"
      - key: VISION_INTERNAL_URL
        value: http://sightline-vision:8011
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: VISION_MODEL
        value: claude-opus-5-5
