[project]
name = "sightbench"
version = "0.1.0"
description = "SightBench: synthetic-hybrid pairs for the unboxing check, and the CLIP image-similarity baseline."
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.5.4",
    "opencv-python-headless==4.14.0.94",
    "pillow==13.0.0",
]

[dependency-groups]
# Only the CLIP baseline needs these. `uv run --group clip ...` installs them; generation does not.
clip = [
    "open-clip-torch==4.2.1",
    "torch==2.14.1",
    "torchvision==0.29.1",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
